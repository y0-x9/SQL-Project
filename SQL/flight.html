<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="flight">
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/p1.webp" alt="Airline Logo" class="brand-logo"><span>Airline System</span></a>
    <button class="nav-toggle" onclick="this.nextElementSibling.classList.toggle('open')">Menu</button>
    <nav class="site-nav">
      <a href="index.html">Home</a><a href="passenger.html">Passenger</a><a href="airport.html">Airport</a>
      <a href="aircraft.html">Aircraft</a><a class="active" href="flight.html">Flight</a><a href="seat.html">Seat</a>
      <a href="booking.html">Booking</a><a href="crewmember.html">Crew Member</a><a href="payment.html">Payment</a><a href="reports.html">Reports</a>
    </nav>
  </header>
  <div class="section">
    <div class="page-title" style="margin-bottom:1.5rem;"><p class="eyebrow">Management</p><h1>Flight</h1></div>
    <div class="form-panel">
      <div class="panel-heading">
        <h2 style="margin:0;">Flight Details</h2>
        <span id="form-mode-badge" class="status-pill status-current">Add Mode</span>
      </div>
      <div class="feature-grid">
        <div><label>Flight ID</label><input type="number" id="flight_id"></div>
        <div><label>Flight Number</label><input type="text" id="flight_no" placeholder="e.g. EY101"></div>
        <div><label>Status</label>
          <select id="status">
            <option value="">Select Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="Boarding">Boarding</option>
            <option value="In Air">In Air</option>
            <option value="Landed">Landed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Delayed">Delayed</option>
          </select>
        </div>
        <div><label>Departure Date &amp; Time</label><input type="datetime-local" id="departure_datetime"></div>
        <div><label>Arrival Date &amp; Time</label><input type="datetime-local" id="arrival_datetime"></div>
        <div><label>Aircraft ID</label><input type="number" id="aircraft_id"></div>
        <div><label>Origin Airport Code</label><input type="text" id="origin_airport_code" placeholder="e.g. AUH"></div>
        <div><label>Destination Airport Code</label><input type="text" id="destination_airport_code" placeholder="e.g. LHR"></div>
      </div>
      <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem;">
        <button class="button buttonsecondary" onclick="addRecord()">Add</button>
        <button class="button buttonsecondary" onclick="updateRecord()">Update</button>
        <button class="button buttonprimary" onclick="deleteRecord()">Delete</button>
        <button class="button buttonsecondary" onclick="clearForm()">Clear</button>
      </div>
      <p id="form-message" class="form-message"></p>
    </div>
    <div class="table-panel" style="margin-top:1.4rem;">
      <div class="panel-heading">
        <h2 style="margin:0;">All Flights</h2>
        <button class="button buttonsecondary" onclick="loadRecords()" style="padding:0.4rem 0.8rem;font-size:0.88rem;">↻ Refresh</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>ID</th><th>Flight No</th><th>Departure</th><th>Arrival</th><th>Status</th><th>Aircraft</th><th>Origin</th><th>Destination</th></tr></thead>
        <tbody id="records-body"><tr><td colspan="8" class="muted" style="text-align:center;padding:2rem;">Loading...</td></tr></tbody></table>
      </div>
    </div>
  </div>
  <footer class="site-footer"><p>&copy; 2026 Airline System. All rights reserved.</p></footer>
  <script>
    const API='flight_api.php';
    const FIELDS=['flight_id','flight_no','departure_datetime','arrival_datetime','status','aircraft_id','origin_airport_code','destination_airport_code'];
    async function loadRecords(){
      const tbody=document.getElementById('records-body');
      tbody.innerHTML='<tr><td colspan="8" class="muted" style="text-align:center;padding:2rem;">Loading...</td></tr>';
      try{
        const data=await(await fetch(API+'?action=getAll')).json();
        if(!data.length){tbody.innerHTML='<tr><td colspan="8" class="muted" style="text-align:center;padding:2rem;">No records found.</td></tr>';return;}
        tbody.innerHTML=data.map(r=>`<tr style="cursor:pointer;" onclick='fillForm(${JSON.stringify(r)})'><td>${r.flight_id}</td><td>${r.flight_no}</td><td>${r.departure_datetime||''}</td><td>${r.arrival_datetime||''}</td><td><span class="status-pill ${stClass(r.status)}">${r.status}</span></td><td>${r.aircraft_id}</td><td>${r.origin_airport_code}</td><td>${r.destination_airport_code}</td></tr>`).join('');
      }catch(e){tbody.innerHTML='<tr><td colspan="8" style="color:var(--red-dark);text-align:center;padding:2rem;">Failed to load records.</td></tr>';}
    }
    function fillForm(r){FIELDS.forEach(f=>document.getElementById(f).value=r[f]||'');badge('Edit Mode','status-planned');}
    async function addRecord(){const fd=build('add');if(!fd)return;post(fd);}
    async function updateRecord(){const fd=build('update');if(!fd)return;post(fd);}
    async function deleteRecord(){
      const id=document.getElementById('flight_id').value;
      if(!id){setMessage('Click a row first.','error');return;}
      if(!confirm('Delete flight ID '+id+'?'))return;
      const fd=new FormData();fd.append('action','delete');fd.append('flight_id',id);post(fd);
    }
    async function post(fd){
      const data=await(await fetch(API,{method:'POST',body:fd})).json();
      setMessage(data.message||data.error,data.success?'success':'error');
      if(data.success){clearForm();loadRecords();}
    }
    function build(action){
      for(const f of FIELDS){if(!document.getElementById(f).value){setMessage('Please fill in all fields.','error');return null;}}
      const fd=new FormData();fd.append('action',action);FIELDS.forEach(f=>fd.append(f,document.getElementById(f).value));return fd;
    }
    function clearForm(){FIELDS.forEach(f=>document.getElementById(f).value='');badge('Add Mode','status-current');setMessage('','');}
    function badge(t,c){const el=document.getElementById('form-mode-badge');el.textContent=t;el.className='status-pill '+c;setMessage('','');}
    function setMessage(msg,type){const el=document.getElementById('form-message');el.textContent=msg;el.className='form-message'+(type?' '+type:'');}
    function stClass(s){if(s==='Scheduled'||s==='Landed')return'status-completed';if(s==='Boarding'||s==='In Air')return'status-current';return'status-planned';}
    loadRecords();
  </script>
</body>
</html>
