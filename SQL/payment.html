<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="payment">
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/p1.webp" alt="Airline Logo" class="brand-logo"><span>Airline System</span></a>
    <button class="nav-toggle" onclick="this.nextElementSibling.classList.toggle('open')">Menu</button>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="passenger.html">Passenger</a>
      <a href="airport.html">Airport</a>
      <a href="aircraft.html">Aircraft</a>
      <a href="flight.html">Flight</a>
      <a href="seat.html">Seat</a>
      <a href="booking.html">Booking</a>
      <a href="crewmember.html">Crew Member</a>
      <a class="active" href="payment.html">Payment</a>
      <a href="reports.html">Reports</a>
    </nav>
  </header>

  <div class="section">
    <div class="page-title" style="margin-bottom:1.5rem;">
      <p class="eyebrow">Management</p>
      <h1>Payment</h1>
    </div>

    <div class="form-panel">
      <div class="panel-heading">
        <h2 style="margin:0;">Payment Details</h2>
        <span id="form-mode-badge" class="status-pill status-current">Add Mode</span>
      </div>

      <div class="feature-grid">
        <div>
          <label>Payment ID</label>
          <input type="number" id="payment_id">
        </div>
        <div>
          <label>Booking ID</label>
          <input type="number" id="booking_id">
        </div>
        <div>
          <label>Payment Date</label>
          <input type="datetime-local" id="payment_date">
        </div>
        <div>
          <label>Amount</label>
          <input type="number" step="0.01" id="amount">
        </div>
        <div>
          <label>Payment Method</label>
          <select id="payment_method">
            <option value="">Select Method</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Cash">Cash</option>
            <option value="Online">Online</option>
          </select>
        </div>
        <div>
          <label>Payment Status</label>
          <select id="payment_status">
            <option value="">Select Status</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Refunded">Refunded</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem;">
        <button class="button buttonsecondary" onclick="addRecord()">Add</button>
        <button class="button buttonsecondary" onclick="updateRecord()">Update</button>
        <button class="button buttonprimary" onclick="deleteRecord()">Delete</button>
        <button class="button buttonsecondary" onclick="clearForm()">Clear</button>
      </div>
      <p id="form-message" class="form-message"></p>
    </div>

    <div class="table-panel" style="margin-top:1.4rem;">
      <div class="panel-heading">
        <h2 style="margin:0;">All Payments</h2>
        <button class="button buttonsecondary" onclick="loadRecords()" style="padding:0.4rem 0.8rem;font-size:0.88rem;">↻ Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Booking ID</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="6" class="muted" style="text-align:center;padding:2rem;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Airline System. All rights reserved.</p>
  </footer>

  <script>
    const API = 'payment_api.php';
    const FIELDS = ['payment_id','booking_id','payment_date','amount','payment_method','payment_status'];

    async function loadRecords() {
      const tbody = document.getElementById('records-body');
      tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem;">Loading...</td></tr>';
      try {
        const data = await (await fetch(API + '?action=getAll')).json();
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem;">No records found.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(r => `
          <tr style="cursor:pointer;" onclick='fillForm(${JSON.stringify(r)})'>
            <td>${r.payment_id}</td>
            <td>${r.booking_id !== null ? r.booking_id : '<span class="status-pill status-planned">Booking Deleted</span>'}</td>
            <td>${r.payment_date || ''}</td>
            <td>${r.amount}</td>
            <td>${r.payment_method}</td>
            <td><span class="status-pill ${stClass(r.payment_status)}">${r.payment_status}</span></td>
          </tr>`).join('');
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:var(--red-dark);text-align:center;padding:2rem;">Failed to load records.</td></tr>';
      }
    }

    function fillForm(r) {
      FIELDS.forEach(f => document.getElementById(f).value = r[f] || '');
      badge('Edit Mode', 'status-planned');
    }

    async function addRecord() { const fd = build('add'); if (!fd) return; post(fd); }
    async function updateRecord() { const fd = build('update'); if (!fd) return; post(fd); }

    async function deleteRecord() {
      const id = document.getElementById('payment_id').value;
      if (!id) { setMessage('Click a row first.', 'error'); return; }
      if (!confirm('Delete payment ID ' + id + '?')) return;
      const fd = new FormData();
      fd.append('action', 'delete');
      fd.append('payment_id', id);
      post(fd);
    }

    async function post(fd) {
      const data = await (await fetch(API, { method: 'POST', body: fd })).json();
      setMessage(data.message || data.error, data.success ? 'success' : 'error');
      if (data.success) { clearForm(); loadRecords(); }
    }

    function build(action) {
      for (const f of FIELDS) {
        if (!document.getElementById(f).value) { setMessage('Please fill in all fields.', 'error'); return null; }
      }
      const fd = new FormData();
      fd.append('action', action);
      FIELDS.forEach(f => fd.append(f, document.getElementById(f).value));
      return fd;
    }

    function clearForm() {
      FIELDS.forEach(f => document.getElementById(f).value = '');
      badge('Add Mode', 'status-current');
      setMessage('', '');
    }

    function badge(t, c) {
      const el = document.getElementById('form-mode-badge');
      el.textContent = t;
      el.className = 'status-pill ' + c;
      setMessage('', '');
    }

    function setMessage(msg, type) {
      const el = document.getElementById('form-message');
      el.textContent = msg;
      el.className = 'form-message' + (type ? ' ' + type : '');
    }

    function stClass(s) {
      if (s === 'Paid') return 'status-completed';
      if (s === 'Pending') return 'status-current';
      return 'status-planned';
    }

    loadRecords();
  </script>
</body>
</html>
